name: verify

# Pull requests only, and not for changes to the docs alone. The jobs run on
# the owner's self-hosted Windows runner (scripts/ci/setup-windows-runner.ps1
# installs its tools), so they bill no Actions minutes; one runner runs one
# job at a time, so the checks are one job and the preview another.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Git for Windows' bash, so the same snippets run here and on a Linux
    # box. Each job's first step puts Git's bin folder first on PATH: a
    # plain "bash" otherwise finds C:\Windows\System32\bash.exe, WSL's
    # launcher, which fails on a PC without a WSL distribution.
    shell: bash

jobs:
  verify:
    # Every Vitest suite once (the Lua harness and the JS tests), with line
    # coverage of the addon's own Lua: a failing test fails the run, and so
    # does coverage below the floor in scripts/lua-coverage-floor.json (only
    # goes up; 100 is the goal). Then the code-quality scan, luacheck, Lua
    # 5.1 syntax (the game runs Lua 5.1; the test harness, fengari, is Lua
    # 5.3), and the release zip's contents.
    name: Tests, coverage and checks
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Git Bash ahead of WSL's bash
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The runner's tools
        run: |
          for tool in luacheck luac5.1; do
            command -v "$tool" >/dev/null || { echo "$tool is not on PATH: run scripts/ci/setup-windows-runner.ps1 on the runner"; exit 1; }
          done
          luacheck --version && luac5.1 -v
      - run: npm ci
      - run: npm run coverage
      - run: npm run quality
      - run: luacheck --no-color .
      - name: Lua 5.1 syntax of every file the TOC loads
        run: |
          status=0
          while IFS= read -r file; do
            file="${file%$'\r'}"
            case "$file" in ''|'#'*) continue ;; esac
            luac5.1 -p "$file" || status=1
          done < Vanguard.toc
          exit $status
      - name: Release zip builds and holds every file it should
        run: |
          rm -rf dist
          node scripts/package.mjs
          node scripts/check-zip.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lua-coverage
          path: coverage/lua-coverage.json

  preview:
    # A screenshot of the default layout from the addon's real Lua (art
    # approximated), so a UI change can be reviewed from the run's artifacts.
    # Chromium stays in the runner's Playwright cache, so the install is a
    # no-op after the first run.
    name: UI preview
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Git Bash ahead of WSL's bash
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install -g playwright@1.56.1 && playwright install chromium
      - run: npm run preview
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: preview/*.png
          if-no-files-found: error

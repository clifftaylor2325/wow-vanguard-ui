name: verify

# Pull requests only.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Every Vitest suite once (the Lua harness and the JS tests), with line
    # coverage of the addon's own Lua: a failing test fails the run, and so
    # does coverage below the floor in scripts/lua-coverage-floor.json (only
    # goes up; 100 is the goal). Then the code-quality scan. This is npm run
    # verify with coverage on, in one run of the suite instead of two.
    name: Tests and Lua coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - run: npm run quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lua-coverage
          path: coverage/lua-coverage.json

  lua51:
    # The game runs Lua 5.1; the test harness (fengari) is Lua 5.3.
    name: Lua 5.1 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Compile every file the TOC loads
        run: |
          status=0
          while IFS= read -r file; do
            file="${file%$'\r'}"
            case "$file" in ''|'#'*) continue ;; esac
            luac5.1 -p "$file" || status=1
          done < ForeverUI.toc
          exit $status

  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua-check
      - run: luacheck --no-color .

  package:
    name: Release zip builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/package.mjs
      - name: Zip is valid and holds every TOC file, Media/ and the libraries' licenses
        run: |
          zip=$(ls dist/*.zip)
          unzip -t "$zip"
          expected=$(( $(grep -cvE '^\s*(#|$)' ForeverUI.toc) + $(git ls-files Media | wc -l) + $(git ls-files Libs | grep -vc '\.lua$') + 2 ))
          actual=$(unzip -Z1 "$zip" | wc -l)
          echo "files: $actual (expected $expected)"
          test "$actual" -eq "$expected"

  preview:
    # A screenshot of the default layout from the addon's real Lua (art
    # approximated), so a UI change can be reviewed from the run's artifacts.
    name: UI preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser download is kept between runs; the install step then
      # only puts its system packages in place.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1-${{ runner.os }}
      - run: npm install -g playwright@1.56.1 && playwright install --with-deps chromium
      - run: npm run preview
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: preview/*.png
          if-no-files-found: error

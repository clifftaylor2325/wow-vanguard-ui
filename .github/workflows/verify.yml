name: verify

# Pull requests only.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # npm run verify is npm test (every Vitest suite, once) plus the code-quality scan.
    name: npm run verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  coverage:
    # Line coverage of the addon's own Lua under the test harness. Fails
    # below the floor in scripts/lua-coverage-floor.json (only goes up; 100 is the goal).
    name: Lua coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lua-coverage
          path: coverage/lua-coverage.json

  lua51:
    # The game runs Lua 5.1; the test harness (fengari) is Lua 5.3.
    name: Lua 5.1 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Compile every file the TOC loads
        run: |
          status=0
          while IFS= read -r file; do
            file="${file%$'\r'}"
            case "$file" in ''|'#'*) continue ;; esac
            luac5.1 -p "$file" || status=1
          done < ForeverUI.toc
          exit $status

  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua-check
      - run: luacheck --no-color .

  package:
    name: Release zip builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/package.mjs
      - name: Zip is valid and holds every TOC file, Media/ and the libraries' licenses
        run: |
          zip=$(ls dist/*.zip)
          unzip -t "$zip"
          expected=$(( $(grep -cvE '^\s*(#|$)' ForeverUI.toc) + $(git ls-files Media | wc -l) + $(git ls-files Libs | grep -vc '\.lua$') + 2 ))
          actual=$(unzip -Z1 "$zip" | wc -l)
          echo "files: $actual (expected $expected)"
          test "$actual" -eq "$expected"

  preview:
    # A screenshot of the default layout from the addon's real Lua (art
    # approximated), so a UI change can be reviewed from the run's artifacts.
    name: UI preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g playwright@1.56.1 && playwright install --with-deps chromium
      - run: npm run preview
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: preview/*.png
          if-no-files-found: error

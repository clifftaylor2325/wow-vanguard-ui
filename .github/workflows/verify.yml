name: verify

# The pull-request gate, built to finish in a few minutes on a GitHub-hosted
# runner: the code-quality scan, luacheck, Lua 5.1 syntax (the game runs Lua
# 5.1; the test harness, fengari, is Lua 5.3), the JS tests plus one Lua
# smoke test (npm run test:quick), and the release zip's contents. The full
# Lua harness with the coverage floor, and the UI preview, take longer, so
# they run in full-suite.yml: after a merge to main, nightly, from the
# Actions tab, or on a pull request carrying the "full-tests" label. Not for
# changes to the docs alone.
#
# Pull requests never run on a self-hosted runner: the repository is public,
# and a pull request's own code runs in these jobs.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: luacheck and Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua-check lua5.1
      - run: npm run quality
      - run: luacheck --no-color .
      - name: Lua 5.1 syntax of every file the TOC loads
        run: |
          status=0
          while IFS= read -r file; do
            file="${file%$'\r'}"
            case "$file" in ''|'#'*) continue ;; esac
            luac5.1 -p "$file" || status=1
          done < Vanguard.toc
          exit $status
      - name: JS tests and the Lua smoke test
        run: npm run test:quick
      - name: Release zip builds and holds every file it should
        run: |
          rm -rf dist
          node scripts/package.mjs
          node scripts/check-zip.mjs

name: verify

# The pull-request gate: the check a pull request needs to merge (the
# "Quick checks" job in the main branch's ruleset). Spelling (typos), the
# code-quality scan, the TOC against the files on disk
# (scripts/check-toc.mjs), luacheck, Lua 5.1 syntax (the game runs Lua 5.1;
# the test harness, fengari, is Lua 5.3), the JS tests plus one Lua smoke
# test (npm run test:quick), and the release zip's contents. Built to finish
# inside a minute: a private repository's Actions minutes are counted, and a
# job bills by the started minute. The full Lua harness with the coverage
# floor runs in full-suite.yml (when a pull request is opened ready for
# review or marked ready for review, on later pushes while it carries the
# "full-tests" label, weekly, and from the Actions tab) and on each release
# (release.yml). Markdown lint is separate and not required (markdown.yml).
# This check runs on every push of a pull request that is not a draft
# (ready_for_review starts it), whatever the label. A draft skips the job
# with its `if`, which counts as passing. There is deliberately no path
# filter (#262): a required check from a workflow skipped by `paths-ignore`
# stays pending and blocks the merge. Instead the job always runs, and its
# first check (scripts/docs-only.mjs) diffs the merge commit against the
# base; when only docs changed (docs/** and *.md), every step after the
# spelling check is skipped, so a docs-only pull request reports "Quick
# checks" in a few seconds without an admin bypass.
#
# Every action is pinned to a full commit SHA, its version in a comment;
# Dependabot (monthly) moves both together.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick checks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Two deep: the pull request's merge commit and both its parents, so the
      # next step can diff it against the base (its first parent).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Docs-only change
        id: changes
        run: node scripts/docs-only.mjs
      # Spelling of code, comments and docs (typos, configured in _typos.toml).
      # It runs for docs-only changes too: docs are what it reads most.
      - name: Spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      # luacheck 1.2.0 is the release binary, installed only after its SHA-256
      # matches (the apt package is an older release). The digest was checked a
      # second way when it was pinned; scripts/workflows.test.mjs holds the same
      # value and fails if this one drifts. The tools group runs beside npm ci,
      # and the wait fails the step if any part of it failed.
      - name: npm ci, with luacheck 1.2.0 and Lua 5.1 installing alongside
        if: steps.changes.outputs.docs_only != 'true'
        env:
          LUACHECK_SHA256: d68da17fca0697d9e2fb04201f3884abd259fa558b3a449bccaed47f1390defc
          LUACHECK_URL: https://github.com/lunarmodules/luacheck/releases/download/v1.2.0/luacheck
        run: |
          (
            sudo apt-get update -qq &&
            sudo apt-get install -y -qq lua5.1 &&
            curl -fsSL -o "$RUNNER_TEMP/luacheck" "$LUACHECK_URL" &&
            echo "$LUACHECK_SHA256  $RUNNER_TEMP/luacheck" | sha256sum -c - &&
            sudo install -m 0755 "$RUNNER_TEMP/luacheck" /usr/local/bin/luacheck
          ) > tools.log 2>&1 &
          tools_pid=$!
          npm ci
          wait "$tools_pid" || { cat tools.log; exit 1; }
      - name: Code-quality scan
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run quality
      - name: The TOC against the files on disk
        if: steps.changes.outputs.docs_only != 'true'
        run: node scripts/check-toc.mjs
      - name: luacheck
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          luacheck --version
          luacheck --no-color .
      - name: Lua 5.1 syntax of every file the TOC loads
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          status=0
          while IFS= read -r file; do
            file="${file%$'\r'}"
            case "$file" in ''|'#'*) continue ;; esac
            luac5.1 -p "$file" || status=1
          done < Vanguard.toc
          exit $status
      - name: JS tests and the Lua smoke test
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run test:quick
      - name: Release zip builds and holds every file it should
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          rm -rf dist
          node scripts/package.mjs
          node scripts/check-zip.mjs

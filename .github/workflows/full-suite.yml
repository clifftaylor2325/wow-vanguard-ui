name: full suite

# Runs lua-suite.yml (every test with the coverage floor, the checks, and the
# UI preview when asked) from the Actions tab, and weekly once the cron line
# below is switched back on. Pull requests never run it (Cliff, 2026-11-10):
# the tests run on a pull request's branch on the agent's machine before it
# merges (CLAUDE.md, Working method). release.yml runs the raid bench and the
# checks without the tests, so the release's author starts this on main
# before the tag (or runs scripts/release-local.mjs). A red run on main
# opens an issue labelled ci-failure (later failures comment on it; GitHub's
# own failure mail for a scheduled run goes to whoever last edited the cron
# line, which may be nobody), and a green one closes it. A run on another
# branch reports nothing: the issue is about main.
#
# A shuffled run (D-05) runs its tests in a seeded random order and puts the
# seed in the job summary with the replay command, to show up a case that
# depends on running after another. The weekly run shuffles; a hand-started
# run keeps the written order unless it asks for the shuffle input. The UI
# preview renders weekly and on a hand-started run that asks for it.
on:
  # No weekly run for now (Cliff, 2026-11-10): the suite took 45 to 60 minutes as one job and stays
  # out of CI until Cliff says to turn it back on. Sharding and the Lua 5.1 engine have merged. Hand-started runs stay.
  # The weekly run comes back with these lines (Sundays at 10:23 UTC; cron is UTC only; off the
  # hour, since GitHub delays runs scheduled on busy minutes):
  #   schedule:
  #     - cron: "23 10 * * 0"
  workflow_dispatch:
    inputs:
      preview:
        description: "Also render the UI preview (a few minutes more)"
        type: boolean
        default: true
      shuffle:
        description: "Run the tests in a seeded random order (the seed and replay command go to the summary)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# The newest run of a kind wins; a hand-started run never cancels a
# scheduled one, or the other way round.
concurrency:
  group: full-suite-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite
    uses: ./.github/workflows/lua-suite.yml
    with:
      preview: ${{ github.event_name == 'schedule' || inputs.preview == true }}
      shuffle: ${{ github.event_name == 'schedule' || inputs.shuffle == true }}

  report:
    # The ci-failure issue: opened or commented on when the suite is red,
    # closed when it is green again.
    name: Report
    needs: suite
    if: always() && needs.suite.result != 'cancelled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.suite.result }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const where = `the ${context.eventName} run on ${context.sha.slice(0, 7)}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "ci-failure" });
            if (process.env.RESULT !== "success") {
              const body = `${where} failed (${process.env.RESULT}): ${run}`;
              if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
              else await github.rest.issues.create({ ...context.repo, title: "Full suite failing on main", body, labels: ["ci-failure"] });
              return;
            }
            for (const issue of open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Green again: ${where} passed: ${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
            }

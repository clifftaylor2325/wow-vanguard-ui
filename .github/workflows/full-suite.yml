name: full suite

# Every Vitest suite (the Lua harness, one file per area, and the JS tests)
# with line coverage of the addon's own Lua: a failing test fails the run,
# and so does coverage below the floor in scripts/lua-coverage-floor.json
# (only goes up; 100 is the goal). Then the code-quality scan, luacheck,
# Lua 5.1 syntax and the release zip's contents; and, as a second job, the
# UI preview. Each takes minutes on the owner's self-hosted Windows runner,
# so this runs after a merge to main, nightly, from the Actions tab, or on
# a pull request only while it carries the "full-tests" label (verify.yml
# is the quick gate every pull request gets). One runner runs one job at a
# time, so the two jobs run one after the other.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    # Daily at 10:23 UTC, early morning in the Americas when the PC is
    # likely idle (cron is UTC only); off the hour, since GitHub delays
    # runs scheduled on busy minutes.
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "Also render the UI preview (about 6 minutes more)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

# The newest run of a kind wins; a push run never cancels a nightly, or
# the other way round.
concurrency:
  group: full-suite-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Git for Windows' bash (see verify.yml).
    shell: bash

jobs:
  tests:
    name: Tests, coverage and checks
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Git Bash ahead of WSL's bash
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"
      - uses: actions/checkout@v4
        with:
          # The same checkout as verify.yml's, so a run here leaves the
          # runner's node_modules for the next pull request's quick gate.
          clean: false
      - name: Clean the checkout, keeping node_modules
        run: git clean -ffdx -e node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The runner's tools
        run: |
          for tool in luacheck luac5.1; do
            command -v "$tool" >/dev/null || { echo "$tool is not on PATH: run scripts/ci/setup-windows-runner.ps1 on the runner"; exit 1; }
          done
          luacheck --version && luac5.1 -v
      - name: npm ci, unless node_modules already matches package-lock.json
        run: |
          stamp=node_modules/.package-lock.sha256
          want="$(node --version) $(sha256sum package-lock.json | cut -d' ' -f1)"
          if [ "$(cat "$stamp" 2>/dev/null)" = "$want" ]; then
            echo "node_modules matches package-lock.json; npm ci skipped"
          else
            npm ci
            echo "$want" > "$stamp"
          fi
      - run: npm run coverage
      - run: npm run quality
      - run: luacheck --no-color .
      - name: Lua 5.1 syntax of every file the TOC loads
        run: |
          status=0
          while IFS= read -r file; do
            file="${file%$'\r'}"
            case "$file" in ''|'#'*) continue ;; esac
            luac5.1 -p "$file" || status=1
          done < Vanguard.toc
          exit $status
      - name: Release zip builds and holds every file it should
        run: |
          rm -rf dist
          node scripts/package.mjs
          node scripts/check-zip.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lua-coverage
          path: coverage/lua-coverage.json
      - name: Open or update the "Full suite failing on main" issue
        # A red run on main, nightly or from the Actions tab gets an issue
        # (one, labelled ci-failure; later failures comment on it), since
        # GitHub's own failure mail for a scheduled run goes to whoever last
        # edited the cron line, which may be nobody.
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The ${context.eventName} run on ${context.sha.slice(0, 7)} failed: ${run}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "ci-failure" });
            if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title: "Full suite failing on main", body, labels: ["ci-failure"] });

  preview:
    # A screenshot of the default layout from the addon's real Lua (art
    # approximated), so a UI change can be reviewed from the run's artifacts.
    # Chromium stays in the runner's Playwright cache, so the install is a
    # no-op after the first run. It needs no green tests job: a UI change is
    # reviewable even when a test fails.
    name: UI preview
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')) && (github.event_name != 'workflow_dispatch' || inputs.preview)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Git Bash ahead of WSL's bash
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Clean the checkout, keeping node_modules
        run: git clean -ffdx -e node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci, unless node_modules already matches package-lock.json
        run: |
          stamp=node_modules/.package-lock.sha256
          want="$(node --version) $(sha256sum package-lock.json | cut -d' ' -f1)"
          if [ "$(cat "$stamp" 2>/dev/null)" = "$want" ]; then
            echo "node_modules matches package-lock.json; npm ci skipped"
          else
            npm ci
            echo "$want" > "$stamp"
          fi
      - run: npm install -g playwright@1.56.1 && playwright install chromium
      - run: npm run preview
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: preview/*.png
          if-no-files-found: error

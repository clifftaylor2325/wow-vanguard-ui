name: lua suite

# The whole Vitest run (the Lua harness, one file per area, and the JS
# tests) with line coverage of the addon's own Lua: a failing test fails
# the run, and so does coverage below the floor in
# scripts/lua-coverage-floor.json (only goes up; 100 is the goal). Then the
# raid benchmark and, with the checks input on, the code-quality scan, the
# TOC check (scripts/check-toc.mjs), luacheck, Lua 5.1 syntax and the release
# zip's contents; and, with the preview input on, the UI preview as a second
# job beside it. A pull request's run keeps the checks off (full-suite.yml):
# verify.yml already ran every one of them on the same commit, so here they
# only repeat work; the weekly, hand-started and release runs keep them.
#
# This workflow has no triggers of its own: full-suite.yml calls it when a
# pull request is opened ready for review or marked ready for review, on
# later pushes while the pull request carries the "full-tests" label,
# weekly and from the Actions tab, and release.yml before each release. On Actions, Vitest also writes failures as
# annotations on the run and a JUnit file (vitest.config.mjs), and the
# Lua-by-area and coverage tables go to the job summary.
#
# With the shuffle input on (the weekly run only, set by full-suite.yml),
# a step picks a seed, exports it as VG_SHUFFLE_SEED and writes it with the
# replay command to the job summary, and Vitest runs files and tests in the
# order that seed gives (vitest.config.mjs). Pull-request, hand-started and
# release runs keep the written order. A failing case is fixed at its cause;
# nothing here runs a failed case again.
on:
  workflow_call:
    inputs:
      checks:
        description: "Also run the quality scan, TOC check, luacheck, Lua 5.1 syntax and release zip steps (verify.yml runs them on every pull request)"
        type: boolean
        default: true
      preview:
        description: "Also render the UI preview (a few minutes more)"
        type: boolean
        default: true
      shuffle:
        description: "Shuffle the test order and print the seed, so a failure can be replayed"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests, coverage and checks
    runs-on: ubuntu-latest
    # On a 2-worker local proxy for a 2-vCPU runner the suite took 155.5 s and
    # 158.7 s (170.7 s with coverage) on 2026-10-11. Hosted runs with coverage
    # grew to 17-25 min by 2026-10-30 (the keybind phases' tests), and two hit
    # the old 25 min limit; 40 leaves room. A runaway still dies inside it (the
    # harness's instruction budget, the workers' heap cap).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same pinned luacheck 1.2.0 release binary as verify.yml: installed
      # only after its SHA-256 matches. The chain is the last thing in the
      # script, so a failed check fails the step before the install runs.
      - name: luacheck 1.2.0 and Lua 5.1
        if: inputs.checks
        env:
          LUACHECK_SHA256: d68da17fca0697d9e2fb04201f3884abd259fa558b3a449bccaed47f1390defc
          LUACHECK_URL: https://github.com/lunarmodules/luacheck/releases/download/v1.2.0/luacheck
        run: |
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq lua5.1 &&
          curl -fsSL -o "$RUNNER_TEMP/luacheck" "$LUACHECK_URL" &&
          echo "$LUACHECK_SHA256  $RUNNER_TEMP/luacheck" | sha256sum -c - &&
          sudo install -m 0755 "$RUNNER_TEMP/luacheck" /usr/local/bin/luacheck
      - name: Pick and print the shuffle seed
        if: inputs.shuffle
        # The seed comes from the clock inside the script; no workflow
        # expression is placed in this text. vitest.config.mjs reads
        # VG_SHUFFLE_SEED, which npm run coverage passes on to Vitest.
        run: |
          seed=$(date +%s)
          echo "VG_SHUFFLE_SEED=$seed" >> "$GITHUB_ENV"
          printf 'Shuffled run, seed %s. Replay: VG_SHUFFLE_SEED=%s npm test (PowerShell: $env:VG_SHUFFLE_SEED=%s; npm test)\n' "$seed" "$seed" "$seed" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm run coverage
      # The raid benchmark (scripts/bench.mjs, issue #255): time and Lua
      # instructions per event under a scripted 40-player raid, a harness
      # measurement until /vg perf confirms it in game. Its tables go to the
      # job summary and its JSON into the lua-coverage artifact. It runs
      # without --budget, so a slowdown never fails the run (shared runners
      # are noisy); an error the addon catches under the raid load does.
      - name: Raid benchmark (harness measurement)
        run: npm run bench -- --summary "$GITHUB_STEP_SUMMARY"
      - name: Code quality
        if: inputs.checks
        run: npm run quality
      - name: The TOC against the files on disk
        if: inputs.checks
        run: node scripts/check-toc.mjs
      - name: luacheck
        if: inputs.checks
        run: |
          luacheck --version
          luacheck --no-color .
      - name: Lua 5.1 syntax of every file the TOC loads
        if: inputs.checks
        run: |
          status=0
          while IFS= read -r file; do
            file="${file%$'\r'}"
            case "$file" in ''|'#'*) continue ;; esac
            luac5.1 -p "$file" || status=1
          done < Vanguard.toc
          exit $status
      - name: Release zip builds and holds every file it should
        if: inputs.checks
        run: |
          rm -rf dist
          node scripts/package.mjs
          node scripts/check-zip.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: lua-coverage
          path: |
            coverage/lua-coverage.json
            coverage/junit.xml
            coverage/bench/*.json
          if-no-files-found: ignore

  preview:
    # A screenshot of the default layout from the addon's real Lua (art
    # approximated), so a UI change can be reviewed from the run's artifacts.
    # It needs no green tests job: a UI change is reviewable even when a
    # test fails.
    name: UI preview
    if: inputs.preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install -g playwright@1.56.1 && playwright install --with-deps chromium
      - run: npm run preview
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui-preview
          path: preview/*.png
          if-no-files-found: error

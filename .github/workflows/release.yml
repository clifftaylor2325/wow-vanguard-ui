name: release

# Publish a GitHub release with the addon zip attached, either by pushing a
# tag like v0.3.0 (matching ## Version in Vanguard.toc) or by running
# this workflow from the Actions tab on main, which tags the commit
# v<TOC version> itself. The whole suite (lua-suite.yml: every test with
# the coverage floor, the checks) runs first, so nothing ships red.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Tag matches the TOC version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        run: |
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' Vanguard.toc | tr -d '\r')
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "v$toc" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but TOC says $toc"; exit 1; }
          else
            test "$GITHUB_REF_NAME" = "main" || { echo "run the release from main, not $GITHUB_REF_NAME"; exit 1; }
            if git rev-parse -q --verify "refs/tags/v$toc" >/dev/null; then
              echo "v$toc already exists; bump ## Version first"; exit 1
            fi
          fi
          echo "tag=v$toc" >> "$GITHUB_OUTPUT"

  suite:
    name: Suite
    needs: version
    uses: ./.github/workflows/lua-suite.yml
    with:
      preview: false

  release:
    name: Publish
    needs: [version, suite]
    runs-on: ubuntu-latest
    # Only this job creates the GitHub release; the others (including the store upload that holds
    # the CurseForge and Wago keys) stay read-only.
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/package.mjs --ref "$GITHUB_SHA"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        # On a manual run, --target creates the tag at this commit.
        run: gh release create "$RELEASE_TAG" dist/*.zip --title "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes

  # After the GitHub release exists, send the same tag to CurseForge and Wago with the BigWigs
  # packager, which builds from .pkgmeta (the files the release zip holds) and reads the project
  # IDs from Vanguard.toc. It needs the repository secrets CF_API_KEY and WAGO_API_TOKEN and skips
  # itself while either is missing. A failure here leaves the GitHub release as it is.
  listings:
    name: CurseForge and Wago
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}
      - name: Upload with the packager
        if: ${{ env.CF_API_KEY != '' && env.WAGO_API_TOKEN != '' }}
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1

name: release

# Publish a GitHub release with the addon zip attached, either by pushing a
# tag like v0.3.0 (matching ## Version in ForeverUI.toc) or by running
# this workflow from the Actions tab on main, which tags the commit
# v<TOC version> itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches the TOC version
        run: |
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' ForeverUI.toc | tr -d '\r')
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "v$toc" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but TOC says $toc"; exit 1; }
          else
            test "$GITHUB_REF_NAME" = "main" || { echo "run the release from main, not $GITHUB_REF_NAME"; exit 1; }
            if git rev-parse -q --verify "refs/tags/v$toc" >/dev/null; then
              echo "v$toc already exists; bump ## Version first"; exit 1
            fi
          fi
          echo "RELEASE_TAG=v$toc" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run verify
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua-check lua5.1
      - run: luacheck --no-color .
      - name: Lua 5.1 syntax
        run: |
          grep -vE '^\s*(#|$)' ForeverUI.toc | tr -d '\r' | xargs -n1 luac5.1 -p
      - run: node scripts/package.mjs --ref "$GITHUB_SHA"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # On a manual run, --target creates the tag at this commit.
        run: gh release create "$RELEASE_TAG" dist/*.zip --title "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes

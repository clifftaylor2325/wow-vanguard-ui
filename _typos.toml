# Spelling check: typos (https://github.com/crate-ci/typos), run on every pull
# request by the "Spelling" step of .github/workflows/verify.yml, docs-only
# ones included. It reads code, comments and docs. Locally:
# `typos` from the repo root, with the binary from its releases page.
#
# A word typos flags that is right here goes below with a note saying why;
# a real misspelling gets fixed instead.

[files]
# Vendored libraries (kept as upstream wrote them), generated media and the
# art sources are not ours to spell-check; the lock file is generated too. The
# Lua 5.1.5 sources under tools/lua51/ are lua.org's, checked by hash.
# Locales/ is ten other languages, which an English spell checker can only misread; so are the
# chat filter's and group board's word lists per locale (Core/MatchWords.lua).
extend-exclude = ["Libs/", "tools/lua51/lua-5.1.5/", "Media/", "art/", "Locales/", "Core/MatchWords.lua", "package-lock.json"]

[default]
# WoW's texture escape, |T<path>:<size>|t: the path is not prose. The TOC's
# translated Notes lines (## Notes-deDE: …) are other languages.
extend-ignore-re = ['\|T[^|\s]*\|t', '(?m)^## (Notes|Title)-[a-z]{2}[A-Z]{2}:.*$']

[default.extend-words]
# WoW vocabulary.
defensives = "defensives" # damage-reduction spells, as players call them
hander = "hander" # a two-hander: a two-handed weapon
varian = "varian" # Varian Wrynn, quoted on the AFK screen
lok = "lok" # "Lok'tar ogar", the Horde's battle cry, quoted on the AFK screen
overlayed = "overlayed" # the client's IsSpellOverlayed (a spell's proc glow)
criterias = "criterias" # the achievement window's list of criteria frames (AchievementsObjectivesMixin.criterias)
strat = "strat" # Stratholme, as LFG chat shortens it (the group board reads it)
ony = "ony" # Onyxia's Lair, as LFG chat shortens it (the group board reads it)
maintenant = "maintenant" # French "now", the group board's age cell in a frFR test
suche = "suche" # German "looking for", in the group board's and chat filter's deDE tests and smoke step
groupe = "groupe" # French "group", in the group board's frFR test
paeth = "paeth" # the Paeth predictor, PNG's filter type 4 (scripts/lib/media-scenes.mjs)
tages = "tages" # German "of the day", the guild message of the day's template in a deDE test
ein = "ein" # German "a", in the locale import's deDE test rows
ist = "ist" # German "is", in a deDE label the text-fit baseline lists
alle = "alle" # German "all", in the nameplates' deDE test
deine = "deine" # German "your", in instance prep's deDE chat line test
# Code and test names.
fo = "fo" # a test's local for Vanguard_focus
failer = "failer" # a test helper: the function that fails on purpose
xdescribe = "xdescribe" # the skipped-suite alias the stray .only/.skip check looks for
mis = "mis" # the prefix in "mis-sized"

[default.extend-identifiers]
PNGs = "PNGs" # plural of PNG
DECIMAL_SEPERATOR = "DECIMAL_SEPERATOR" # the client's own global, misspelt in its GlobalStrings
LARGE_NUMBER_SEPERATOR = "LARGE_NUMBER_SEPERATOR" # the client's own global, misspelt in its GlobalStrings
